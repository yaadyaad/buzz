[package]
name = "buzz-ws-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nostr = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
# TLS: читает системные корневые сертификаты (macOS Keychain), а не только
# встроенные webpki-roots. Без этого WebSocket отвергает самоподписанный CA
# с "invalid peer certificate: UnknownIssuer", хотя HTTP-стек его принимает.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
